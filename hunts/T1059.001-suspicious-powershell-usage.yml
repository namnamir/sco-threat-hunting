name: Suspicious PowerShell Usage Hunt
id: 8c45fbb5-4b77-4b03-a0f6-4a4c1de2e76c
version: 1
date: '2026-09-15'
author: soc-threat-hunting contributors
kind: hunt
use: threat-hunt
status: experimental
description: Identify PowerShell activity that combines encoded execution, download or execution bypasses, credential access, or remote administration indicators. This is a hunting query and should not become an alert without environment-specific baselining.
platforms:
  - splunk
log_source:
  product: windows
  service: sysmon
  event_id: 1
mitre:
  - T1059.001
  - T1027
  - T1105
query: |
  index=sysmon sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=1
  (match(lower(Image), "\\powershell(\\.exe)?$") OR match(lower(OriginalFileName), "powershell.exe$"))
  | eval command_line=coalesce(CommandLine, "")
  | eval indicator_count=if(match(command_line, "(?i)(-enc(odedcommand)?\\s|frombase64string|iex\\s|invoke-expression|downloadstring|downloadfile|net\\.webclient|bypass|hidden|disable.*realtime|amsi|reflection|mimikatz|sekurlsa|invoke-command|enter-pssession)"), 1, 0)
  | where indicator_count=1
  | stats min(_time) as first_seen max(_time) as last_seen values(ParentImage) as parent_image values(User) as user values(CommandLine) as command_line count by ComputerName
  | convert ctime(first_seen) ctime(last_seen)
  | sort - count
data_required:
  - Sysmon Event ID 1 with Image, OriginalFileName, CommandLine, ParentImage, User, and ComputerName
triage:
  - Confirm the full command line and parent process with the endpoint owner.
  - Check whether the user, host, parent process, and script are expected administrative activity.
  - Pivot to network connections, PowerShell 4103/4104, and authentication events for the same host and user.
  - Escalate when encoded execution is paired with download, credential access, or an unusual parent process.
false_positives:
  - Software deployment and endpoint management agents.
  - Approved administration scripts and penetration testing.
tuning:
  - Replace broad indicators with allowlisted scripts, signed publishers, and known management parent processes.
references:
  - https://attack.mitre.org/techniques/T1059/001/
